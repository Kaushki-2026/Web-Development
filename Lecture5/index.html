<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel = "stylesheet" href="style.css"

</head>
<body>
    <img width = "230" height="230 " src="image.png" alt="Schlors image">

    <!-- We use only one the height and width, another one will automatically adjust

     <br>
     <table>

        <thead>
            <!-- header content -->
             header

            <th>Course</th>

            <td rowspan="2">HNBGU</td>

            <!-- td = table data -->
            <td colspan="2">Sam</td>
            <td>B.com</td>
            <td>badminton</td>
        </tr>
        </tbody>
     </table>
     <tfoot> 
            <!-- footer content -->
             footer
